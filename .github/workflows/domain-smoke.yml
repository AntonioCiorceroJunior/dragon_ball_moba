name: Dragon MOBA pure C# domain smoke
on:
  pull_request:
  push:
    branches:
      - "chatgpt/moba-integrated-*"
jobs:
  domain-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile and exercise gameplay domain
        run: dotnet run --project tests/DomainSmoke/DomainSmoke.csproj --configuration Release
